name: Production Tag Deployment

on:
  push:
    tags:
      - "v*"

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    environment: molaryx-frontend-vercel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing secret VERCEL_ORG_ID"
            missing=1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing secret VERCEL_PROJECT_ID"
            missing=1
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing secret VERCEL_TOKEN"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add them in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "All required Vercel secrets are present"

      - name: Verify tag is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag no apunta a un commit de main. Abortando deploy."
            exit 1
          fi
          echo "OK: $GITHUB_SHA está en el historial de main"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Project Artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
